name: verify

on:
  push:
    branches:
      - main
      - "feature/**"
      - "release/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify
        run: |
          bash scripts/verify.sh

  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify
        shell: pwsh
        run: |
          ./scripts/verify.ps1
