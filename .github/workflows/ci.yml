name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and CI tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" mypy
      - name: Ruff (advisory)
        continue-on-error: true
        run: python -m ruff check .
      - name: Mypy (advisory)
        continue-on-error: true
        run: python -m mypy src
      - name: Pytest
        run: python -m pytest -q
